name: Windows Flutter
on:
  push:
    branches: ['**']
    tags: ['windows-v*']
    paths: ['windows/**', 'plugin/**', 'plugin.json', 'mcp.windows.json', 'skills/background-studio/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'plugin/**', 'plugin.json', 'mcp.windows.json', 'skills/background-studio/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Test and package Windows app
        shell: powershell
        run: |
          npm ci --prefix plugin --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Plugin dependencies could not be installed.' }
          npm test --prefix plugin
          if ($LASTEXITCODE -ne 0) { throw 'Plugin tests failed.' }
          ./windows/scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Xskin-Windows
          path: |
            build/windows/*.zip
            build/windows/*.sha256
          if-no-files-found: error
  cross-platform:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    uses: ./.github/workflows/ci.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: [build, cross-platform]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Xskin-Windows
          path: build/windows
      - name: Publish verified Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content windows/VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne "windows-v$version") { throw 'Tag and package versions differ.' }
          $notes = ((Get-Content windows/CHANGELOG.md -Raw) -split '(?m)^## ', 3)[1]
          $notes | Set-Content "$env:RUNNER_TEMP/release-notes.md"
          $files = @(Get-ChildItem build/windows/*.zip, build/windows/*.zip.sha256 | ForEach-Object FullName)
          if ($files.Count -ne 4) { throw 'Expected two ZIPs and two checksums.' }
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "Xskin $version for Windows" --notes-file "$env:RUNNER_TEMP/release-notes.md"

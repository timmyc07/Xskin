name: Windows Flutter
on:
  push:
    paths: ['windows/**', 'plugin/**', 'plugin.json', 'mcp.windows.json', 'skills/background-studio/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'plugin/**', 'plugin.json', 'mcp.windows.json', 'skills/background-studio/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Test and package Windows app
        shell: powershell
        run: |
          npm ci --prefix plugin --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Plugin dependencies could not be installed.' }
          npm test --prefix plugin
          if ($LASTEXITCODE -ne 0) { throw 'Plugin tests failed.' }
          ./windows/scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Xskin-Windows
          path: |
            build/windows/*.zip
            build/windows/*.sha256
          if-no-files-found: error

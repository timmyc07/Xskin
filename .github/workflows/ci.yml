name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            bash -n "$file"
          done < <(
            find macos -type f \( -name '*.sh' -o -name '*.command' \) \
              ! -path '*/release/*' -print
          )
          bash -n plugin/launch-macos.sh

      - name: Build and test embedded studio
        run: |
          npm ci --prefix plugin --ignore-scripts --no-audit --no-fund
          npm run build --prefix plugin
          git diff --exit-code -- plugin/dist
          npm test --prefix plugin

      - name: Check Node.js syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file" >/dev/null
          done < <(
            find macos windows -type f \( -name '*.mjs' -o -name '*.js' \) -print
          )

      - name: Check Windows PowerShell source encoding
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          function visit(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(file);
              if (!entry.isFile() || path.extname(file) !== ".ps1") continue;
              const bytes = fs.readFileSync(file);
              const hasBom = bytes.subarray(0, 3).equals(Buffer.from([0xef, 0xbb, 0xbf]));
              const content = hasBom ? bytes.subarray(3) : bytes;
              if (content.some((byte) => byte >= 0x80) && !hasBom) {
                throw new Error(`${file}: non-ASCII PowerShell 5.1 source requires a UTF-8 BOM`);
              }
            }
          }

          visit("windows");
          NODE

      - name: Check runtime safety assertions
        shell: bash
        run: |
          if grep -R -n -E 'dream-skin-skin|DREAM_SKIN_SKIN|1\.0\.0-rc2' \
            macos/scripts macos/assets >/dev/null; then
            printf 'Legacy release-candidate identifiers remain in runtime files.\n' >&2
            exit 1
          fi
          if grep -R -n -E '(writeFile|rename|copyFile|rm).*app\.asar' \
            macos/scripts >/dev/null; then
            printf 'A runtime script appears to mutate app.asar.\n' >&2
            exit 1
          fi
          if grep -n -E '/usr/bin/python3|(^|[[:space:]])eval([[:space:]]|$)' \
            macos/scripts/common-macos.sh >/dev/null; then
            printf 'The macOS runtime must parse state without python3 or eval.\n' >&2
            exit 1
          fi

      - name: Check version consistency
        shell: bash
        run: |
          expected="$(tr -d '\r\n' < macos/VERSION)"
          common="$(sed -n 's/^SKIN_VERSION="\([^"]*\)"$/\1/p' macos/scripts/common-macos.sh)"
          macos_injector="$(sed -n 's/^const SKIN_VERSION = "\([^"]*\)";$/\1/p' macos/scripts/injector.mjs)"
          windows_injector="$(sed -n 's/^const SKIN_VERSION = "\([^"]*\)";$/\1/p' windows/scripts/injector.mjs)"
          test -n "$expected"
          test "$common" = "$expected"
          test "$macos_injector" = "$expected"
          node -e 'const fs = require("node:fs"); for (const file of ["plugin.json", "plugin/package.json", "macos/package.json"]) { if (JSON.parse(fs.readFileSync(file)).version !== process.argv[1]) process.exit(1); }' "$expected"
          windows_expected="$(tr -d '\r\n' < windows/VERSION)"
          test "$windows_injector" = "$windows_expected"

      - name: Run portable Node.js regressions
        shell: bash
        run: |
          for file in macos/tests/*.test.mjs; do
            if [[ "$file" != "macos/tests/background-studio.test.mjs" ]]; then
              node --test "$file"
            fi
          done
          for file in windows/tests/*.test.mjs; do
            if [[ "$file" != "windows/tests/panel-command.test.mjs" && "$file" != "windows/tests/installer.test.mjs" && "$file" != "windows/tests/startup-rollback.test.mjs" ]]; then
              node --test "$file"
            fi
          done
          node macos/scripts/injector.mjs --check-payload >/dev/null
          node windows/scripts/injector.mjs --check-payload >/dev/null

  macos-studio-tests:
    name: macOS studio backend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run native studio regression suite
        run: node --test macos/tests/background-studio.test.mjs
      - name: Run macOS launcher and runtime fixtures
        shell: bash
        run: |
          export NODE="$(command -v node)"
          for suite in autostart install-upgrade native-code studio-runtime image-loader; do
            /bin/bash "macos/tests/$suite.test.sh"
          done

  windows-tests:
    name: Windows (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            executable: powershell.exe
          - name: PowerShell 7
            executable: pwsh.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Windows regression suite
        shell: cmd
        run: ${{ matrix.executable }} -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\windows\tests\run-tests.ps1
